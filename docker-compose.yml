services:
  postgres:
    image: postgres:16-alpine
    container_name: head-office-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: head_office
      POSTGRES_USER: head_office
      POSTGRES_PASSWORD: head_office
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
