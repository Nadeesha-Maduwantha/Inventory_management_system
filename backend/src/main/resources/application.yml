spring:
  application:
    name: stockms

  profiles:
    active: local

  datasource:
    url: jdbc:postgresql://localhost:5432/head_office
    username: head_office
    password: head_office

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-application-local-yml-or-env}
    access-token-expiry-minutes: 30
    refresh-token-expiry-days: 7
  cors:
    allowed-origins: http://localhost:3000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
